<!doctype html><style>body{background:#737980;color:white;font:18px sans-serif;margin:10px}img{width:31vw;image-rendering:pixelated}h2{margin:4px}button{font-size:20px;margin:5px}</style><div id="buttons"></div><h2 id="title"></h2><div id="gifs"></div><script>const moves=["idle", "walk", "sand_kick", "ear_burst", "sonic_boom", "dig", "pop_out", "death"];function show(m){document.querySelector('#title').textContent=m+' / front - side - back / sel-out';document.querySelector('#gifs').innerHTML=['front','side','back'].map(v=>`<img src="preview-${m}-${v}.gif">`).join('')}moves.forEach(m=>{let b=document.createElement('button');b.textContent=m;b.onclick=()=>show(m);document.querySelector('#buttons').append(b)});show(moves[0]);</script>
